<div class="login-container">
  <mat-card class="login-card mat-elevation-z8">
    <div class="login-header">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Please login to access your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="your@email.com">
        <mat-icon matPrefix>mail_outline</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <!-- Password Field -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" placeholder="••••••••">
        <mat-icon matPrefix>lock_outline</mat-icon>
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <!-- Remember Me & Forgot Password -->
      <div class="login-options">
        <mat-checkbox>Remember me</mat-checkbox>
      </div>

      <!-- Login Button -->
      <button mat-raised-button color="primary" class="login-button" [disabled]="loginForm.invalid">
        <mat-icon>login</mat-icon>
        Sign In
      </button>

    </form>
  </mat-card>

  <!-- Background Elements -->
  <div class="login-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>
</div>
