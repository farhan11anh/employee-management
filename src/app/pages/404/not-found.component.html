<div class="not-found-container">
  <div class="error-content">
    <!-- Animasi SVG atau Gambar -->
    <div class="error-image">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
        <circle cx="400" cy="300" r="200" fill="#f8f9fa"/>
        <path d="M300 200L500 400M300 400L500 200" stroke="#dc3545" stroke-width="10"/>
        <text x="400" y="320" font-family="Arial" font-size="80" text-anchor="middle" fill="#343a40">404</text>
      </svg>
    </div>

    <h1>Oops! Halaman Tidak Ditemukan</h1>
    <p class="error-description">
      Sepertinya Anda tersesat di antah berantah. Halaman yang Anda cari mungkin telah dipindahkan atau tidak ada lagi.
    </p>

    <div class="action-buttons">
      <button mat-raised-button color="primary" routerLink="/">
        <mat-icon>home</mat-icon>
        Kembali ke Beranda
      </button>
    </div>

  </div>
</div>
